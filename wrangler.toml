name = "sportspicks"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"

# `npx wrangler d1 create sportspicks` prints the database_id to paste here.
[[d1_databases]]
binding = "DB"
database_name = "sportspicks"
database_id = "61ad36f0-1768-4e50-815a-8b88bf225b30"

# Pulls the schedule and scores every 10 minutes. The page also refreshes them on view.
[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
